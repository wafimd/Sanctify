name: Build Sanctify IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep -E '^Xcode' | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate app icon
        run: python3 scripts/generate_icon.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no codesign)
        run: |
          xcodebuild \
            -project Sanctify.xcodeproj \
            -scheme Sanctify \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            SYMROOT="$(pwd)/build" \
            clean build

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -not -path "*/Build/Intermediates*" | head -1)
          [ -z "$APP" ] && echo "::error::No .app found after build" && exit 1
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr Sanctify.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sanctify-${{ github.run_number }}
          path: Sanctify.ipa
          retention-days: 30
